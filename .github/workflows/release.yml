name: Publish Windows and Mac release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SofaPad-*
          path: build/release-assets
          merge-multiple: true
      - name: Validate all four packages before creating a release
        run: python3 scripts/publish-release.py --version "${GITHUB_REF_NAME#v}" --assets build/release-assets --commit "$GITHUB_SHA" --dry-run
      - name: Upload to a draft and publish only after all files match
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --version "${GITHUB_REF_NAME#v}" --assets build/release-assets --commit "$GITHUB_SHA"
