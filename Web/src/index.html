<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8eade">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SofaPad</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body data-mode="touch" data-state="connecting">
  <main id="viewport">
    <div id="surface" aria-label="触控板：单指移动和点击，双指右键和滚动，三指滑动拖动" aria-disabled="true"></div>
    <section id="text-mode" hidden aria-label="输入模式">
      <label class="sr-only" for="draft">要贴入 Mac 的文字</label>
      <textarea id="draft" placeholder="在这里输入文字…" autocomplete="off" spellcheck="true" aria-describedby="paste-notice"></textarea>
      <button id="paste" class="primary" disabled>贴入输入框</button>
    </section>
    <button id="open-settings" class="floating settings-button" aria-label="手感设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
    <button id="mode-toggle" class="floating mode-button" aria-pressed="false">输入</button>
    <div id="connection-notice" class="notice" role="status"><span id="detail">正在连接 Mac…</span><button id="retry" hidden>重新连接</button></div>
    <div id="paste-notice" class="notice paste-notice" role="status" hidden></div>
    <div id="preview" hidden>演示模式 · 不操作 Mac</div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="sheet-header"><h2 id="settings-title">手感设置</h2><button class="close-button" id="close-settings" aria-label="关闭设置">✕</button></div>
    <label class="slider-label" for="pointer-speed">指针与拖动速度<output id="pointer-value">1.8×</output></label>
    <input id="pointer-speed" type="range" min="0.3" max="4" step="0.1" value="1.8">
    <label class="slider-label" for="scroll-speed">滚动速度<output id="scroll-value">1.4×</output></label>
    <input id="scroll-speed" type="range" min="0.3" max="4" step="0.1" value="1.4">
    <label class="toggle-row" for="natural"><span>自然滚动<small>内容跟随手指的方向移动</small></span><input id="natural" type="checkbox" checked></label>
    <button class="secondary" id="reset">恢复默认手感</button>
  </dialog>
</body>
</html>
